  # ========== PREPROCESSOR SERVICE ==========
  preprocessor-consumer:
    build:
      context: .
      dockerfile: preprocessor_service/Dockerfile
    env_file:
      - .env
    volumes:
      - ./preprocessor_service/app:/app/app
      - ./common:/app/common
    command: ["python", "-m", "app.consumer.v1_consumer"]
    restart: always

  # ========== LOG PROCESSOR SERVICE ==========
  log-processor-consumer:
    build:
      context: .
      dockerfile: log_processor_service/Dockerfile
    env_file:
      - .env
    volumes:
      - ./log_processor_service/app:/app/app
      - ./common:/app/common
    command: ["python", "-m", "app.consumer.v1_consumer"]
    restart: always

  # ========== INFRASTRUCTURE ==========
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  kafka-data:
  redis-data:
