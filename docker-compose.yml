services:
  # ========== JUDGE AGENT SERVICES ==========
  judge-api:
    build:
      context: .
      dockerfile: judge_agent/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - DATABASE_URI=mongodb://db:27017
    volumes:
      - ./judge_agent/app:/app/app
      - ./judge_agent/wsgi.py:/app/wsgi.py
      - ./judge_agent/run.py:/app/run.py
      - ./common:/app/common
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "wsgi:app"]
    restart: always

  judge-consumer:
    build:
      context: .
      dockerfile: judge_agent/Dockerfile
    env_file:
      - .env
    volumes:
      - ./judge_agent/app:/app/app
      - ./judge_agent/wsgi.py:/app/wsgi.py
      - ./judge_agent/run.py:/app/run.py
      - ./common:/app/common
    command: ["python", "-m", "app.consumer.v1_consumer"]
    restart: always

  # ========== SAGA ORCHESTRATOR SERVICES ==========
  saga-api:
    build:
      context: .
      dockerfile: SAGA_orchestrator/Dockerfile
    ports:
      - "8001:8001"                         # <-- host:container
    env_file:
      - .env
    volumes:
      - ./SAGA_orchestrator/app:/app/app
      - ./SAGA_orchestrator/wsgi.py:/app/wsgi.py
      - ./SAGA_orchestrator/run.py:/app/run.py
      - ./common:/app/common
    command: ["gunicorn", "--worker-class", "gthread", "--threads", "10", "--bind", "0.0.0.0:8001", "wsgi:app"]   # <-- bind to 8001
    restart: always

  saga-consumer:
    build:
      context: .
      dockerfile: SAGA_orchestrator/Dockerfile
    env_file:
      - .env
    volumes:
      - ./SAGA_orchestrator/app:/app/app
      - ./SAGA_orchestrator/wsgi.py:/app/wsgi.py
      - ./SAGA_orchestrator/run.py:/app/run.py
      - ./common:/app/common
    command: ["python", "-m", "app.core.consumer"]
    restart: always

  saga-celery:                                 # <-- separate worker service
    build:
      context: .
      dockerfile: SAGA_orchestrator/Dockerfile
    env_file:
      - .env
    volumes:
      - ./SAGA_orchestrator/app:/app/app
      - ./SAGA_orchestrator/wsgi.py:/app/wsgi.py
      - ./SAGA_orchestrator/run.py:/app/run.py
      - ./SAGA_orchestrator/run_worker.py:/app/run_worker.py
      - ./common:/app/common
    command: ["python", "run_worker.py"]     # starts Celery worker
    restart: always

  # ========== PII EXTRACTION ATTACK SERVICES ==========
  pii-api:
    build:
      context: .
      dockerfile: PII_extraction_attack/Dockerfile
    ports:
      - "8002:8002"
    env_file:
       - .env
    volumes:
      - ./PII_extraction_attack/app:/app/app
